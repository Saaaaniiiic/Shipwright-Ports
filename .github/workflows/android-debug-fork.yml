name: Android Debug APK (fork)

on:
  workflow_dispatch:
  push:
    branches: [dynamic-touch-hud]

permissions:
  contents: read

concurrency:
  group: android-debug-fork-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Apply Android engine support
        run: |
          git -C libultraship apply ../CMake/patches/libultraship-android.patch
          git -C libultraship apply --ignore-space-change ../CMake/patches/libultraship-powervr.patch
          git -C libultraship apply ../CMake/patches/libultraship-android-fullscreen.patch
      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libzip-dev libpng-dev zlib1g-dev
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Check touch input routing
        run: |
          for test in ocarina right_stick bindings context; do
            g++ -std=c++20 -I. -Isoh "tests/android_touch_hud/$test.cpp" -o "$RUNNER_TEMP/touch-$test"
            "$RUNNER_TEMP/touch-$test"
          done
          javac -d "$RUNNER_TEMP/touch-context-java" Android/app/src/main/java/com/dishii/soh/TouchContext.java tests/android_touch_hud/TouchContextCheck.java
          java -cp "$RUNNER_TEMP/touch-context-java" com.dishii.soh.TouchContextCheck
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: android-debug-gradle-${{ runner.os }}-${{ hashFiles('Android/**/*.gradle', 'Android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: android-debug-gradle-${{ runner.os }}-
      - name: Install Android toolchain
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;26.0.10792818" "cmake;3.31.5" "platforms;android-31" "build-tools;35.0.0"
      - name: Generate matching support archive
        run: |
          cmake -S . -B build-host-tools -G Ninja -DSOH_TOOLS_ONLY=ON -DCMAKE_BUILD_TYPE=Release
          cmake --build build-host-tools --target GenerateSohOtr --parallel 4
          test -s build-host-tools/soh/soh.o2r
      - name: Build debug ARM64 APK
        working-directory: Android
        env:
          CMAKE_BUILD_PARALLEL_LEVEL: '4'
        run: ./gradlew :app:assembleDebug --console=plain --max-workers=4
      - uses: actions/upload-artifact@v4
        with:
          name: SOH-dynamic-touch-debug
          path: Android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
